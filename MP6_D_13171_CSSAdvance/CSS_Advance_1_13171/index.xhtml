<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Kompetisi Mahasiswa &amp; Umum</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <h1 class="form-title">Formulir Pendaftaran Kompetisi</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="0" cellpadding="8" border="1" style="border-collapse:collapse; width:100%; border: 1px solid #ddd;">
            
            <!-- SECTION 1: INFORMASI TIM -->
            <tr>
                <td colspan="2" style="background-color: var(--warna-1); color: white; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 1px; padding: 10px;">
                    Informasi Tim &amp; Ketua
                </td>
            </tr>

            <tr>
                <td style="width:32%;">
                    <label for="namatim"><strong>Nama Tim / Peserta</strong></label>
                </td>
                <td>
                    <input type="text" id="namatim" name="namatim" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="ketua"><strong>Nama Lengkap Ketua Tim</strong></label>
                </td>
                <td>
                    <input type="text" id="ketua" name="ketua" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="jumlah"><strong>Jumlah Anggota Tim</strong></label>
                </td>
                <td>
                    <select id="jumlah" name="jumlah">
                        <option>1 Orang</option>
                        <option>2 Orang</option>
                        <option>3 Orang</option>
                        <option>4 Orang</option>
                        <option>5 Orang</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="telepon"><strong>Nomor Telepon / WhatsApp (Perwakilan)</strong></label>
                </td>
                <td>
                    <input type="text" id="telepon" name="telepon" size="30" />
                </td>
            </tr>

            <tr>
                <td>
                    <label for="universitas">
                        <strong>Asal Perguruan Tinggi / Instansi</strong>
                    </label>
                </td>
                <td>
                    <input type="text" id="universitas" name="universitas" size="30" />
                </td>
            </tr>

            <!-- SECTION 2: PILIHAN BIDANG & KATEGORI -->
            <tr>
                <td colspan="2" style="background-color: var(--warna-1); color: white; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 1px; padding: 10px; border-top: 3px solid #ccc;">
                    Bidang &amp; Kategori Kompetisi
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Bidang Kompetisi Pilihan</strong>
                </td>
                <td>
                    <p>
                        <input type="checkbox" id="coding" name="bidang" value="Coding" />
                        <label for="coding">Coding / Pemrograman</label>
                    </p>
                    <p>
                        <input type="checkbox" id="desain" name="bidang" value="Desain" />
                        <label for="desain">Desain UI/UX &amp; Grafis</label>
                    </p>
                    <p>
                        <input type="checkbox" id="video" name="bidang" value="Video" />
                        <label for="video">Pembuatan Video Kreatif</label>
                    </p>
                    <p>
                        <input type="checkbox" id="essay" name="bidang" value="Essay" />
                        <label for="essay">Penulisan Essay Ilmiah</label>
                    </p>
                </td>
            </tr>

            <tr>
                <td>
                    <strong>Kategori Peserta</strong>
                </td>
                <td>
                    <input type="radio" id="mahasiswa" name="peserta" value="Mahasiswa" />
                    <label for="mahasiswa">Mahasiswa Aktif</label>
                    &nbsp;&nbsp;
                    <input type="radio" id="umum" name="peserta" value="Umum" />
                    <label for="umum">Masyarakat Umum</label>
                </td>
            </tr>

            <!-- SECTION 3: DETAIL KARYA & BERKAS -->
            <tr>
                <td colspan="2" style="background-color: var(--warna-1); color: white; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 1px; padding: 10px; border-top: 3px solid #ccc;">
                    Detail Karya &amp; Berkas Pendaftaran
                </td>
            </tr>

            <tr>
                <td>
                    <label for="deskripsi">
                        <strong>Deskripsi Singkat Karya</strong>
                    </label>
                </td>
                <td>
                    <textarea id="deskripsi" name="deskripsi" rows="10" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td style="vertical-align:top;">
                    <label for="alasan">
                        <strong>Motivasi Mengikuti Kompetisi</strong>
                    </label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="7" cols="30"></textarea>
                </td>
            </tr>

            <tr>
                <td>
                    <label for="filekarya"><strong>Unggah Berkas Karya</strong></label>
                </td>
                <td>
                    <input type="file" id="filekarya" name="filekarya"
                        accept="application/pdf, image/jpeg, image/png" />
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center; padding: 15px;">
                    <input class="tombol-submit" type="submit" name="daftar" value="Kirim Pendaftaran" />
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
